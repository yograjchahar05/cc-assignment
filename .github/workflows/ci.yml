name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test_bad_model:
        description: "Set to 'true' to deliberately test an untrained model and demonstrate quality gate failure"
        required: false
        default: "false"

jobs:
  # Stage 1: Secret Scanning
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2: Linting
  lint:
    name: Linting (Ruff)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check service/ worker/ training/ tests/

  # Stage 3: Unit Tests
  unit-tests:
    name: Unit Tests (Pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu
          pip install transformers pytest fastapi pydantic boto3 requests

      - name: Run Pytest
        run: pytest tests/

  # Stage 4: Model Evaluation and Quality Gate
  model-evaluation:
    name: Model Evaluation & Quality Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu
          pip install transformers boto3 requests

      - name: Download Model Artifact from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_BAD_MODEL: ${{ github.event.inputs.test_bad_model }}
        run: |
          mkdir -p models/v1
          if [ "$TEST_BAD_MODEL" = "true" ]; then
            echo "DEMO MODE: Deliberately loading untrained baseline to demonstrate quality gate failure"
            python -c "from transformers import AutoModelForCausalLM, AutoTokenizer; m = AutoModelForCausalLM.from_pretrained('EleutherAI/pythia-70m'); t = AutoTokenizer.from_pretrained('EleutherAI/pythia-70m'); m.save_pretrained('models/v1'); t.save_pretrained('models/v1')"
          else
            echo "Downloading trained student model from release v1.0.0..."
            gh release download v1.0.0 --dir models/v1 --clobber
          fi

      - name: Run Evaluation on validation.jsonl
        run: |
          mkdir -p results
          python -c "
          import json, torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          tokenizer = AutoTokenizer.from_pretrained('models/v1')
          if tokenizer.pad_token is None:
              tokenizer.pad_token = tokenizer.eos_token
          model = AutoModelForCausalLM.from_pretrained('models/v1')
          model.eval()

          preds = []
          with open('data/validation.jsonl', encoding='utf-8') as f:
              for line in f:
                  item = json.loads(line)
                  prompt = f'Command: {item[\"text\"]}\nJSON:'
                  inputs = tokenizer(prompt, return_tensors='pt')
                  with torch.no_grad():
                      out = model.generate(**inputs, max_new_tokens=64, pad_token_id=tokenizer.eos_token_id, do_sample=False)
                  text = tokenizer.decode(out[0], skip_special_tokens=True)
                  raw = text.split('JSON:', 1)[1].strip() if 'JSON:' in text else text[len(prompt):].strip()
                  if '}' in raw:
                      raw = raw[:raw.index('}') + 1]
                  preds.append({'id': item['id'], 'prediction': raw})

          with open('results/student_validation.jsonl', 'w', encoding='utf-8') as f:
              for p in preds:
                  f.write(json.dumps(p) + '\n')
          "

      - name: Quality Gate (score.py --min-validity 95)
        run: |
          python tools/score.py results/student_validation.jsonl data/validation.jsonl --out results/student_validation.json --min-validity 95

      - name: Upload Evaluation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: results/

