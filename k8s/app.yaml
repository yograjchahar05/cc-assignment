apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-parser
  namespace: app
  labels:
    app: command-parser
spec:
  replicas: 2
  selector:
    matchLabels:
      app: command-parser
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: command-parser
    spec:
      containers:
        - name: service
          image: command-parser-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MODEL_URI
              value: "s3://models/v1"
            - name: MODEL_VERSION
              value: "v1"
            - name: S3_ENDPOINT
              value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
            - name: MAX_NEW_TOKENS
              value: "128"
            - name: FAULT_INJECT
              value: "0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: command-parser-service
  namespace: app
spec:
  type: ClusterIP
  selector:
    app: command-parser
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: command-parser-ingress
  namespace: app
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: command-parser-service
                port:
                  number: 8000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: command-parser-service
                port:
                  number: 8000
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: command-parser-service
                port:
                  number: 8000

