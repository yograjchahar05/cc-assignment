apiVersion: batch/v1
kind: Job
metadata:
  name: worker-shard-0
  namespace: pipeline
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: command-parser-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: TEACHER_URL
              value: "http://ollama.pipeline.svc.cluster.local:11434"
            - name: S3_ENDPOINT
              value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
---
